<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
</head>
<body>
<h1>Categorias</h1>
<p><a href="/">Início</a></p>

<h2>Cadastrar categoria</h2>
<form action="/categorias" method="post">
    <label>Nome: <input type="text" name="nome" required></label>
    <label>Descrição: <input type="text" name="descricao" required></label>
    <button type="submit">Cadastrar</button>
</form>

<h2>Categorias cadastradas</h2>
<p th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>
<table th:unless="${#lists.isEmpty(categorias)}" border="1">
    <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Ação</th>
    </tr>
    <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.nome}"></td>
        <td th:text="${categoria.descricao}"></td>
        <td>
            <form th:action="@{/categorias/{id}/excluir(id=${categoria.id})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
