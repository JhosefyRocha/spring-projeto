<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
</head>
<body>
<h1>Usuários</h1>
<p><a href="/">Início</a></p>

<h2>Cadastrar usuário</h2>
<form action="/usuarios" method="post">
    <label>Nome: <input type="text" name="nome" required></label>
    <label>E-mail: <input type="email" name="email" required></label>
    <label>Telefone: <input type="text" name="telefone" required></label>
    <button type="submit">Cadastrar</button>
</form>

<h2>Usuários cadastrados</h2>
<p th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado.</p>
<table th:unless="${#lists.isEmpty(usuarios)}" border="1">
    <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Ação</th>
    </tr>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.nome}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.telefone}"></td>
        <td>
            <form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
