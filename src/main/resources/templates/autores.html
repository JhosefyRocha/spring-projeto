<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores</h1>
<p><a href="/">Início</a></p>

<h2>Cadastrar autor</h2>
<form action="/autores" method="post">
    <label>Nome: <input type="text" name="nome" required></label>
    <label>Nacionalidade: <input type="text" name="nacionalidade" required></label>
    <button type="submit">Cadastrar</button>
</form>

<h2>Autores cadastrados</h2>
<p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>
<table th:unless="${#lists.isEmpty(autores)}" border="1">
    <tr>
        <th>Nome</th>
        <th>Nacionalidade</th>
        <th>Ação</th>
    </tr>
    <tr th:each="autor : ${autores}">
        <td th:text="${autor.nome}"></td>
        <td th:text="${autor.nacionalidade}"></td>
        <td>
            <form th:action="@{/autores/{id}/excluir(id=${autor.id})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
