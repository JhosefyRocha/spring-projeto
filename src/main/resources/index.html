<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Livros</title>
</head>
<body>
<h1>Biblioteca</h1>

<h2>Cadastrar livro</h2>
<form action="/livros" method="post">
    <label>
        Título:
        <input type="text" name="titulo" required>
    </label>
    <label>
        Autor:
        <input type="text" name="autor" required>
    </label>
    <label>
        ISBN:
        <input type="text" name="isbn" required>
    </label>
    <button type="submit">Cadastrar</button>
</form>

<h2>Livros cadastrados</h2>
<p th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado.</p>
<table th:unless="${#lists.isEmpty(livros)}" border="1">
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro : ${livros}">
        <td>
            <input type="text" name="titulo" th:value="${livro.titulo}"
                   th:attr="form=|editar-${livro.id}|" aria-label="Título" required>
        </td>
        <td>
            <input type="text" name="autor" th:value="${livro.autor}"
                   th:attr="form=|editar-${livro.id}|" aria-label="Autor" required>
        </td>
        <td>
            <input type="text" name="isbn" th:value="${livro.isbn}"
                   th:attr="form=|editar-${livro.id}|" aria-label="ISBN" required>
        </td>
        <td>
            <form th:id="|editar-${livro.id}|"
                  th:action="@{/livros/{id}/editar(id=${livro.id})}" method="post"></form>
            <button type="submit" th:attr="form=|editar-${livro.id}|">Salvar</button>
            <form th:action="@{/livros/{id}/excluir(id=${livro.id})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
